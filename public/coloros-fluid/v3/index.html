<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorOS · Fluid background study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0066ff;font:12px system-ui;color:white;overflow:hidden}#motion, .still{position:fixed;inset:0}canvas{display:block}.still{width:100%;height:100%;object-fit:cover;display:none}.static .still{display:block}.static #motion{display:none}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 18px;background:rgba(10,35,80,.72);backdrop-filter:blur(18px);border:1px solid #ffffff30;border-radius:12px;white-space:nowrap}button,select{background:#ffffff15;border:1px solid #ffffff30;border-radius:6px;padding:8px;color:#fff;font:inherit;cursor:pointer}option{color:#123}label{display:flex;gap:8px;align-items:center}input{width:90px;accent-color:#b5efff}.hidden{display:none}small{opacity:.6}@media(max-width:600px){nav{width:calc(100% - 24px);gap:8px;flex-wrap:wrap;justify-content:center}small{display:none}}
</style></head><body>
<img class="still" src="fluid-python.png" alt="Python 生成的蓝色流体折射背景"><div id="motion"></div>
<nav aria-label="背景预览控制"><select id="version" aria-label="版本"><option value="p5">V3 · 动态</option><option value="python">V3 · 静态</option></select><button id="pause">暂停流动</button><label>速度<input id="speed" aria-label="流动速度" type="range" min="0.1" max="2.5" step="0.05" value="1"></label><button id="save">导出 PNG</button><a href="../" style="color:#fff">第二版</a><small>H 隐藏控制栏</small></nav>
<script src="../vendor/p5.min.js"></script><script src="sketch.js"></script>
</body></html>
